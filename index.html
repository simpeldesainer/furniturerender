<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA ARCHIVE — 3D Furniture Showcase</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Minimalist Header -->
  <header class="header">
    <div class="logo">AURA ARCHIVE</div>
    <nav class="nav">
      <a href="#collection">Collection</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Main Showcase Section -->
  <main class="showcase">
    <!-- Left Navigation Arrow -->
    <button class="nav-arrow left" id="prevBtn" aria-label="Previous Product">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>

    <!-- Product Image Viewer Frame -->
    <div class="product-viewport" id="viewport">
      <img id="activeImage" class="product-image" src="images/aethel/angle_1.png" alt="Furniture Angle View">
      
      <!-- Interactive Cursor Hover Area overlay -->
      <div class="hover-zone" id="hoverZone"></div>
    </div>

    <!-- Right Navigation Arrow -->
    <button class="nav-arrow right" id="nextBtn" aria-label="Next Product">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </main>

  <!-- Product Details Footer -->
  <footer class="product-meta">
    <div class="meta-container">
      <h1 class="product-title" id="productTitle">Aethel Low Table</h1>
      <p class="product-description" id="productDesc">
        Sculptural green onyx marble slab paired with dual tapered ebonized oak legs and subtle brushed brass base trim.
      </p>
      <div class="product-specs" id="productSpecs">
        <span>Dim: 180 × 75 × 42 cm</span>
        <span class="dot">•</span>
        <span>Material: Green Onyx & Ebonized Oak</span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
